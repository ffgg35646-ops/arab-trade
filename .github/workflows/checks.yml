name: Arab Trade checks
concurrency:
  group: arab-trade-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/withdrawals-from-scratch-20261016, fix/navigation-latency-20261021]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Withdrawal policy tests
        run: node --experimental-strip-types --test tests/package-withdrawal-policy.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Lint remaining deposit and package implementation
        run: >-
          npx eslint app/api/packages/route.ts app/api/deposits/route.ts
          app/api/admin/deposits/route.ts app/api/blockchain/verify-deposit/route.ts
          app/api/admin/payment/route.ts app/api/wallet/route.ts
          app/api/admin/referral/route.ts app/api/referral/route.ts
          app/dashboard/packages/page.tsx app/dashboard/assets/deposit/page.tsx
          app/admin/packages/page.tsx app/admin/referral/page.tsx
          lib/settlement.ts models/PaymentOption.ts
          models/UserPackage.ts models/BlockchainDepositClaim.ts
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule '@typescript-eslint/ban-ts-comment: off'
      - name: ESLint check (existing project debt reported separately)
        continue-on-error: true
        run: >-
          npx eslint . --rule '@typescript-eslint/no-explicit-any: off' --rule '@typescript-eslint/ban-ts-comment: off'

name: Arab Trade checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint check
        run: "npx eslint . --rule '@typescript-eslint/no-explicit-any: off' --rule '@typescript-eslint/ban-ts-comment: off'"
      - name: Production build
        run: npm run build

name: Arab Trade checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Financial flow integration tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/arabtrade_test?replicaSet=rs0
          AUTH_SECRET: ci-financial-test-secret-with-more-than-thirty-two-characters
          BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          docker run -d --name arabtrade-mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            docker rm -f arabtrade-mongodb >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 60); do
            if docker exec arabtrade-mongodb mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          docker exec arabtrade-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'

          primary=0
          for i in $(seq 1 60); do
            if docker exec arabtrade-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then primary=1; break; fi
            sleep 1
          done
          test "$primary" = "1"

          FINANCIAL_TEST_MODE=prepare node scripts/test-financial-flows.mjs

          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/arabtrade-next.log 2>&1 &
          server_pid=$!
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/payment-options >/dev/null; then healthy=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/arabtrade-next.log; exit 1; fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then cat /tmp/arabtrade-next.log; exit 1; fi

          node scripts/test-financial-flows.mjs || { cat /tmp/arabtrade-next.log; exit 1; }
      - name: ESLint check (existing project debt reported separately)
        continue-on-error: true
        run: >-
          npx eslint . --rule '@typescript-eslint/no-explicit-any: off' --rule '@typescript-eslint/ban-ts-comment: off'
